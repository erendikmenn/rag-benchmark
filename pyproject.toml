[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rag-benchmark"
version = "0.1.0"
description = "Reproducible offline Turkish retrieval and generation experiments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Mehmet Eren Dikmen"}]
dependencies = ["numpy>=2.0,<3", "bm25s>=0.3.12,<0.4", "httpx>=0.28,<1", "huggingface-hub>=0.34,<2"]

[project.optional-dependencies]
models = ["sentence-transformers[image]>=6.1,<7", "torch>=2.8,<3", "accelerate>=1.0,<2", "transformers>=5.19,<6", "laya==0.3.28"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12"]

[project.scripts]
rag-benchmark = "rag_benchmark.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
