# Private source data and embeddings live in the named volume, never in the image.
services:
  db:
    image: pgvector/pgvector@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    ports:
      - "127.0.0.1:55433:5432"
    environment:
      POSTGRES_DB: ragturk
      POSTGRES_USER: ragturk_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - ragturk_pgvector_data:/var/lib/postgresql
      - ./work/ragturk-pgvector/postgres-password:/run/secrets/postgres-password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragturk_owner -d ragturk"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2
volumes:
  ragturk_pgvector_data:
